version: "3.9"

services:
  # -------------------------------------------------------
  # Backend — FastAPI + DistilBERT inference server
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fake_news_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/checkpoints/fake-news-bert
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount local checkpoints so the container uses your fine-tuned weights
      - ./backend/checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # -------------------------------------------------------
  # Frontend — Nginx static file server
  # -------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: fake_news_ui
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: fake_news_network
